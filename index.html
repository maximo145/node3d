    function filterCategory(category) {
        currentFilter = category;

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
            btn.classList.add('bg-slate-800', 'text-slate-300');
        });

        const activeBtn = document.getElementById(`btn-${category}`);
        if (activeBtn) {
            activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
            activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
        }

        renderCatalog();
    }

    function renderCatalog() {
        catalogContainer.innerHTML = '';

        const filteredProducts = currentFilter === 'all'
            ? products
            : products.filter(p => p.category === currentFilter);

        if (currentFilter === 'all') {
            const categories = [
                { key: 'mas-vendido', name: 'Lo más vendido', icon: 'fa-fire' },
                { key: 'muneco', name: 'Muñecos BT21', icon: 'fa-child-reaching' },
                { key: 'lightstick', name: 'Adornos LightStick', icon: 'fa-wand-magic-sparkles' },
                { key: 'llavero', name: 'Llaveros', icon: 'fa-key' },
                { key: 'portavasos', name: 'Portavasos', icon: 'fa-mug-saucer' },
                { key: 'fundas', name: 'Fundas', icon: 'fa-mobile-screen' },
                { key: 'lentes', name: 'Lentes', icon: 'fa-glasses' },
                { key: 'letras', name: 'Letras', icon: 'fa-font' },
                { key: 'abrelatas', name: 'Abrelatas', icon: 'fa-utensils' }
            ];

            categories.forEach(cat => {
                const catProducts = products.filter(p => p.category === cat.key);
                if (catProducts.length > 0) {
                    renderCarouselSection(cat.name, cat.key, cat.icon, catProducts);
                }
            });
        } else {
            let title = 'Resultados';
            let icon = 'fa-border-all';
            const foundCat = products.find(p => p.category === currentFilter);
            if (foundCat) title = foundCat.categoryName;

            renderCarouselSection(title, currentFilter, icon, filteredProducts);
        }
    }

                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="scrollCarousel('${sectionId}', 'right')" class="w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 flex items-center justify-center shadow-sm transition active:scale-95">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div id="carousel-${sectionId}" class="flex gap-6 overflow-x-auto no-scrollbar pb-4 pt-2 px-1 snap-x scroll-smooth"></div>
        `;

        catalogContainer.appendChild(sectionDiv);
        const carouselTrack = document.getElementById(`carousel-${sectionId}`);

        items.forEach(product => {
            const card = document.createElement('div');
            card.className = 'min-w-[260px] sm:min-w-[280px] max-w-[280px] bg-white rounded-3xl shadow-sm hover:shadow-xl border border-slate-100 transition duration-300 flex flex-col overflow-hidden group cursor-pointer snap-start';
            card.onclick = () => openModal(product.id);

            card.innerHTML = `
                <div class="relative w-full h-64 bg-slate-100 overflow-hidden">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-slate-800 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">
                        ${product.categoryName || 'Colección'}
                    </span>
                </div>
                <div class="p-5 flex flex-col flex-grow justify-between gap-4">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base line-clamp-1 group-hover:text-indigo-600 transition">${product.name}</h3>
                        <p class="text-xs text-slate-500 mt-1 line-clamp-2">${product.description}</p>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <span class="text-lg font-black text-slate-900">${product.price}</span>
                        <span class="bg-indigo-50 text-indigo-600 font-semibold text-xs px-3 py-2 rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition">Ver más</span>
                    </div>
                </div>
            `;
            carouselTrack.appendChild(card);
        });
    }

    function scrollCarousel(sectionId, direction) {
        const carousel = document.getElementById(`carousel-${sectionId}`);
        if (carousel) {
            const scrollAmount = direction === 'left' ? -320 : 320;
            carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
    }

    function openModal(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;

        const modalContent = document.getElementById('modalContent');
        const message = encodeURIComponent(`Hola, me interesa este producto: *${product.name}* (${product.price}). ¿Está disponible?`);
        const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${message}`;

        modalContent.innerHTML = `
            <div class="relative h-72 md:h-full bg-slate-100">
                <img src="${product.image}" alt="${product.name}" class="w-full h-full">
            </div>
            <div class="p-6 md:p-8 flex flex-col justify-between gap-6">
                <div>
                    <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${product.categoryName || 'Detalle'}</span>
                    <h2 class="text-2xl font-black text-slate-900 mt-2">${product.name}</h2>
                    <p class="text-2xl font-bold text-indigo-600 mt-1">${product.price}</p>
                    <p class="text-sm text-slate-600 mt-4 leading-relaxed">${product.description}</p>
                </div>
                <div class="flex flex-col gap-3 pt-4 border-t border-slate-100">
                    <a href="${whatsappUrl}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-2xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-3 text-sm">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Comprar por WhatsApp
                    </a>
                    <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-2xl transition text-sm">
                        Cerrar
                    </button>
                </div>
            </div>
        `;

        document.getElementById('productModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('productModal').classList.add('hidden');
    }
</script>
</body>
</html>
